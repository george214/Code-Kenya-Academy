kind = "mobile"
previewPath = "/mobile/"
title = "Code Campus KE"
description = "A mobile learning app for Kenyan students aged 13–20 to learn HTML, CSS, JavaScript, PHP, and MySQL through guided lessons, daily streaks, and course completion certificates."
version = "1.0.0"
id = "artifacts/mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 18115

[services.development]
run = "pnpm --filter @workspace/mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/mobile", "run", "serve" ]

[services.env]
PORT = "18115"
BASE_PATH = "/mobile/"
